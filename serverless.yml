service: abstractplay-designer
org: abstractplay

frameworkVersion: "4"

provider:
    name: aws
    runtime: nodejs14.x
    stage: dev
    region: us-east-1
    profile: AbstractPlayDev
    stackTags:
        ap:service: ${self:service}
        ap:stage: ${self:provider.stage}
    tags:
        ap:service: ${self:service}
        ap:stage: ${self:provider.stage}

plugins:
    - serverless-finch

custom:
    # AWS Billing → Cost allocation tags (activate ap:service and ap:stage once per account).
    apCostAllocationTags:
        ap:service: ${self:service}
        ap:stage: ${self:provider.stage}

    client:
        bucketName: designer.abstractplay.com
        distributionFolder: ./dist
        tags: ${self:custom.apCostAllocationTags}
        indexDocument: index.html
        objectHeaders:
            "assets/**":
                - name: Cache-Control
                  value: "public, max-age=31536000, immutable"
            "index.html":
                - name: Cache-Control
                  value: "no-cache, no-store, must-revalidate"
            ALL_OBJECTS:
                - name: Cache-Control
                  value: "public, max-age=3600"
